<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人 Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --success: #16a34a;
      --success-light: #f0fdf4;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      --sidebar-w: 230px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body.sidebar-collapsed { --sidebar-w: 68px; }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; }

    .app { min-height: 100vh; display: flex; }

    /* ===== 側邊欄（可收起） ===== */
    .sidebar {
      width: var(--sidebar-w);
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 10;
      transition: width 0.2s;
      overflow: hidden;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 4px 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
      padding-left: 8px;
    }
    .brand span { color: var(--primary); }

    .toggle-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 18px;
    }
    .toggle-btn:hover { background: var(--primary-light); color: var(--primary); }

    .nav { display: grid; gap: 8px; }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      background: transparent;
      color: #4b5563;
      white-space: nowrap;
      transition: 0.2s;
    }
    .nav-btn:hover { background: #f8fafc; }
    .nav-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 700; }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }

    /* 收起狀態：只留圖示 */
    body.sidebar-collapsed .brand,
    body.sidebar-collapsed .nav-text { display: none; }
    body.sidebar-collapsed .sidebar-head { justify-content: center; padding-left: 0; padding-right: 0; }
    body.sidebar-collapsed .nav-btn { justify-content: center; padding: 12px 0; }

    .main {
      margin-left: var(--sidebar-w);
      width: calc(100% - var(--sidebar-w));
      padding: 28px;
      transition: margin-left 0.2s, width 0.2s;
    }

    .page { display: none; max-width: 1180px; margin: 0 auto; }
    .page.active { display: block; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .page-header h1 { margin: 0 0 4px; font-size: 26px; }
    .page-header p { margin: 0; color: var(--muted); font-size: 14px; }

    .btn { padding: 10px 16px; border-radius: 10px; font-weight: 700; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(0.95); }
    .btn-secondary { background: #f3f4f6; color: #374151; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stat-card { padding: 16px 18px; }
    .stat-label { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 800; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 18px;
      align-items: start;
    }

    .card { padding: 20px; }
    .card h2 { font-size: 17px; margin: 0 0 14px; }

    .progress-wrap { display: flex; align-items: center; gap: 12px; }
    .progress { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; flex: 1; }
    .progress-bar { height: 100%; width: 0; background: var(--primary); border-radius: inherit; transition: width 0.25s; }
    .progress-number { min-width: 44px; text-align: right; font-weight: 800; }

    /* ===== 精簡版待辦卡片 ===== */
    .task-list { display: grid; gap: 8px; }

    .task-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
    }
    .task-card.completed { opacity: 0.7; }
    .task-card.completed .task-title { text-decoration: line-through; }
    .task-card.has-desc { cursor: pointer; }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .task-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-card.expanded .task-title { white-space: normal; word-break: break-word; }

    .task-tags { display: flex; gap: 6px; flex-shrink: 0; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .priority-high { background: #fee2e2; color: #b91c1c; }
    .priority-medium { background: #fef3c7; color: #b45309; }
    .priority-low { background: #dcfce7; color: #15803d; }
    .status-complete { background: var(--success-light); color: var(--success); }
    .status-pending { background: #f3f4f6; color: #4b5563; }

    .task-description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-card.expanded .task-description {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .task-bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .task-bottom .progress { height: 6px; }
    .task-percent { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 36px; text-align: right; }

    .task-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .small-btn {
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      background: #f3f4f6;
      color: #374151;
      white-space: nowrap;
    }
    .small-btn.complete { background: var(--success-light); color: var(--success); }
    .small-btn.delete { background: var(--danger-light); color: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 16px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      font-size: 14px;
    }

    .field label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; }
    .form-grid { display: grid; gap: 14px; }

    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .field textarea { min-height: 90px; resize: vertical; }

    .range-row { display: flex; align-items: center; gap: 12px; }
    .range-row input { flex: 1; padding: 0; }
    .range-value { width: 52px; text-align: right; font-weight: 800; }
    .range-scale {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin: 2px 64px 0 0;
    }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

    .reminder-section { margin-bottom: 20px; }
    .reminder-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 17px; }
    .reminder-title.overdue { color: var(--danger); }
    .reminder-title.today { color: var(--warning); }
    .reminder-title.upcoming { color: #ca8a04; }

    .notice { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; font-size: 14px; display: none; }
    .notice.show { display: block; }
    .notice.success { background: var(--success-light); color: #166534; }
    .notice.error { background: var(--danger-light); color: #991b1b; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
    }
    .modal-header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { margin: 0; }

    .close-btn { width: 36px; height: 36px; border-radius: 50%; background: #f3f4f6; color: #4b5563; font-size: 20px; }

    .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }

    @media (max-width: 900px) {
      .main { padding: 20px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 650px) {
      body, body.sidebar-collapsed { --sidebar-w: 0px; }
      .app { display: block; }
      .sidebar {
        position: sticky;
        top: 0;
        width: 100%;
        padding: 8px 10px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.96);
      }
      .sidebar-head { padding: 0 0 6px; }
      .nav { grid-template-columns: repeat(3, 1fr); }
      .nav-btn { justify-content: center; padding: 8px 4px; font-size: 13px; }
      /* 手機版收起 = 隱藏整個導覽列 */
      body.sidebar-collapsed .sidebar-head { justify-content: space-between; padding: 0; }
      body.sidebar-collapsed .brand { display: block; }
      body.sidebar-collapsed .nav { display: none; }
      body.sidebar-collapsed .sidebar-head { padding: 0; }
      .main { margin-left: 0; width: 100%; padding: 14px 12px; }
      .page-header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .page-header h1 { font-size: 22px; }
      .stats { gap: 8px; }
      .stat-card { padding: 12px; }
      .stat-value { font-size: 22px; }
      .card { padding: 14px; }
      .task-row { align-items: flex-start; flex-direction: column; gap: 4px; }
      .task-bottom { flex-wrap: wrap; }
      .task-bottom .progress { flex-basis: 60%; }
      .task-actions { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">My <span>Dashboard</span></div>
        <button class="toggle-btn" id="sidebarToggle" aria-label="收合或展開側邊欄" title="收合／展開側邊欄">☰</button>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-page="dashboard" title="Dashboard"><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></button>
        <button class="nav-btn" data-page="tasks" title="待辦事項"><span class="nav-icon">📝</span><span class="nav-text">待辦事項</span></button>
        <button class="nav-btn" data-page="reminders" title="提醒"><span class="nav-icon">🔔</span><span class="nav-text">提醒</span></button>
      </nav>
    </aside>

    <main class="main">
      <div id="notice" class="notice"></div>

      <section id="dashboard" class="page active">
        <div class="page-header">
          <div>
            <h1>Dashboard</h1>
            <p>快速查看目前的待辦事項與完成進度。</p>
          </div>
          <button class="btn btn-primary" id="quickAddBtn">＋ 新增待辦事項</button>
        </div>

        <div class="stats">
          <div class="stat-card"><div class="stat-label">全部待辦</div><div class="stat-value" id="totalCount">0</div></div>
          <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value" id="completedCount">0</div></div>
          <div class="stat-card"><div class="stat-label">未完成</div><div class="stat-value" id="pendingCount">0</div></div>
          <div class="stat-card"><div class="stat-label">完成率</div><div class="stat-value" id="completionRate">0%</div></div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <h2>整體完成進度</h2>
            <div class="progress-wrap">
              <div class="progress"><div class="progress-bar" id="overallProgressBar"></div></div>
              <div class="progress-number" id="overallProgressText">0%</div>
            </div>
          </div>

          <div class="card">
            <h2>待辦事項預覽</h2>
            <div id="dashboardTaskList" class="task-list"></div>
          </div>
        </div>

        <div class="footer-note">資料會儲存在此瀏覽器的 LocalStorage。</div>
      </section>

      <section id="tasks" class="page">
        <div class="page-header">
          <div>
            <h1>待辦事項</h1>
            <p>新增、編輯、完成或刪除你的待辦事項。點擊卡片可展開完整說明。</p>
          </div>
          <button class="btn btn-primary" id="addTaskBtn">＋ 新增待辦事項</button>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>

      <section id="reminders" class="page">
        <div class="page-header">
          <div>
            <h1>提醒</h1>
            <p>查看已逾期、今天到期與即將到期的待辦事項。</p>
          </div>
        </div>

        <div class="reminder-section">
          <h2 class="reminder-title overdue">🔴 已逾期</h2>
          <div id="overdueList" class="task-list"></div>
        </div>

        <div class="reminder-section">
          <h2 class="reminder-title today">🟠 今天到期</h2>
          <div id="todayList" class="task-list"></div>
        </div>

        <div class="reminder-section">
          <h2 class="reminder-title upcoming">🟡 即將到期</h2>
          <div id="upcomingList" class="task-list"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modalTitle">新增待辦事項</h2>
        <button class="close-btn" id="closeModalBtn" aria-label="關閉">×</button>
      </div>

      <form id="taskForm" class="form-grid">
        <div class="field">
          <label for="taskTitle">事項名稱 *</label>
          <input id="taskTitle" type="text" maxlength="100" placeholder="例如：完成 Web App 作業" required />
        </div>

        <div class="field">
          <label for="taskDescription">事項說明</label>
          <textarea id="taskDescription" maxlength="500" placeholder="輸入這項工作的詳細內容"></textarea>
        </div>

        <div class="field">
          <label for="taskDueDate">截止日期 *</label>
          <input id="taskDueDate" type="date" required />
        </div>

        <div class="field">
          <label for="taskPriority">優先程度</label>
          <select id="taskPriority">
            <option value="high">高</option>
            <option value="medium" selected>中</option>
            <option value="low">低</option>
          </select>
        </div>

        <div class="field">
          <label for="taskProgress">完成進度（每 10% 一格）</label>
          <div class="range-row">
            <input id="taskProgress" type="range" min="0" max="100" step="10" value="0" />
            <div class="range-value" id="rangeValue">0%</div>
          </div>
          <div class="range-scale"><span>0</span><span>50</span><span>100</span></div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveTaskBtn">新增</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "personal_dashboard_tasks_v1";
    const SIDEBAR_KEY = "personal_dashboard_sidebar_collapsed";
    const PROGRESS_STEP = 10; // 進度以 10% 為單位
    let tasks = loadTasks();
    let editingId = null;

    const $ = (id) => document.getElementById(id);

    /* ---------- LocalStorage ---------- */
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
      } catch (error) {
        console.error("讀取 LocalStorage 失敗：", error);
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.error("儲存 LocalStorage 失敗：", error);
        showNotice("資料儲存失敗，請確認瀏覽器是否允許 LocalStorage。", "error");
      }
    }

    /* ---------- 工具函式 ---------- */
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // 將任意進度值轉成 0~100 且為 10 的倍數
    function snapProgress(value) {
      const n = Math.max(0, Math.min(100, Number(value) || 0));
      return Math.round(n / PROGRESS_STEP) * PROGRESS_STEP;
    }

    function showNotice(message, type = "success") {
      const notice = $("notice");
      notice.textContent = message;
      notice.className = `notice show ${type}`;
      clearTimeout(showNotice.timer);
      showNotice.timer = setTimeout(() => { notice.className = "notice"; }, 2200);
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(dateString) {
      if (!dateString) return "未設定";
      const date = new Date(dateString + "T00:00:00");
      if (Number.isNaN(date.getTime())) return dateString;
      return date.toLocaleDateString("zh-TW", { month: "2-digit", day: "2-digit" });
    }

    function localTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function priorityText(priority) {
      return { high: "高", medium: "中", low: "低" }[priority] || "中";
    }

    function priorityClass(priority) {
      return { high: "priority-high", medium: "priority-medium", low: "priority-low" }[priority] || "priority-medium";
    }

    // 優先程度排序：高 → 中 → 低
    const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

    function getSortedTasks(list) {
      return [...list].sort((a, b) => {
        if (Boolean(a.completed) !== Boolean(b.completed)) return a.completed ? 1 : -1;
        const dateA = a.dueDate || "9999-12-31";
        const dateB = b.dueDate || "9999-12-31";
        if (dateA !== dateB) return dateA.localeCompare(dateB);
        return (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1);
      });
    }

    /* ---------- 卡片 HTML（精簡版） ---------- */
    function taskHTML(task) {
      const progress = snapProgress(task.progress);
      const completed = Boolean(task.completed);
      const hasDesc = Boolean(task.description);

      return `
        <article class="task-card ${completed ? "completed" : ""} ${hasDesc ? "has-desc" : ""}">
          <div class="task-row">
            <h3 class="task-title">${escapeHTML(task.title)}</h3>
            <div class="task-tags">
              <span class="tag ${priorityClass(task.priority)}">${priorityText(task.priority)}</span>
              <span class="tag status-pending">📅 ${formatDate(task.dueDate)}</span>
              <span class="tag ${completed ? "status-complete" : "status-pending"}">${completed ? "已完成" : "未完成"}</span>
            </div>
          </div>
          ${hasDesc ? `<p class="task-description">${escapeHTML(task.description)}</p>` : ""}
          <div class="task-bottom">
            <div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
            <span class="task-percent">${progress}%</span>
            <div class="task-actions">
              ${!completed
                ? `<button class="small-btn complete" data-action="complete" data-id="${task.id}">✓ 完成</button>`
                : `<button class="small-btn" data-action="reopen" data-id="${task.id}">↩ 重開</button>`}
              <button class="small-btn" data-action="edit" data-id="${task.id}">編輯</button>
              <button class="small-btn delete" data-action="delete" data-id="${task.id}">刪除</button>
            </div>
          </div>
        </article>
      `;
    }

    function emptyHTML(message = "目前沒有待辦事項") {
      return `<div class="empty">${message}</div>`;
    }

    /* ---------- 畫面渲染 ---------- */
    function renderDashboard() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const pending = total - completed;
      const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

      $("totalCount").textContent = total;
      $("completedCount").textContent = completed;
      $("pendingCount").textContent = pending;
      $("completionRate").textContent = `${rate}%`;
      $("overallProgressBar").style.width = `${rate}%`;
      $("overallProgressText").textContent = `${rate}%`;

      const preview = getSortedTasks(tasks).slice(0, 5);
      $("dashboardTaskList").innerHTML = preview.length
        ? preview.map(taskHTML).join("")
        : emptyHTML();
    }

    function renderTasks() {
      const list = getSortedTasks(tasks);
      $("taskList").innerHTML = list.length
        ? list.map(taskHTML).join("")
        : emptyHTML("目前沒有待辦事項，先新增一個吧！");
    }

    function renderReminders() {
      const today = localTodayString();
      const pending = tasks.filter(task => !task.completed && task.dueDate);

      const overdue = pending
        .filter(task => task.dueDate < today)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      const todayTasks = pending
        .filter(task => task.dueDate === today)
        .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1));

      const upcoming = pending
        .filter(task => task.dueDate > today)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
        .slice(0, 10);

      $("overdueList").innerHTML = overdue.length ? overdue.map(taskHTML).join("") : emptyHTML("目前沒有已逾期的事項。");
      $("todayList").innerHTML = todayTasks.length ? todayTasks.map(taskHTML).join("") : emptyHTML("今天沒有到期的事項。");
      $("upcomingList").innerHTML = upcoming.length ? upcoming.map(taskHTML).join("") : emptyHTML("目前沒有即將到期的事項。");
    }

    function renderAll() {
      renderDashboard();
      renderTasks();
      renderReminders();
    }

    /* ---------- 頁面切換 / 側邊欄 ---------- */
    function switchPage(pageId) {
      document.querySelectorAll(".page").forEach(page => {
        page.classList.toggle("active", page.id === pageId);
      });
      document.querySelectorAll(".nav-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.page === pageId);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setSidebarCollapsed(collapsed) {
      document.body.classList.toggle("sidebar-collapsed", collapsed);
      try { localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0"); } catch (e) { /* 忽略 */ }
    }

    function initSidebar() {
      let collapsed = false;
      try { collapsed = localStorage.getItem(SIDEBAR_KEY) === "1"; } catch (e) { /* 忽略 */ }
      setSidebarCollapsed(collapsed);
    }

    /* ---------- 新增 / 編輯視窗 ---------- */
    function openModal(task = null) {
      const progress = snapProgress(task?.progress ?? 0);
      editingId = task ? task.id : null;
      $("modalTitle").textContent = task ? "編輯待辦事項" : "新增待辦事項";
      $("saveTaskBtn").textContent = task ? "儲存修改" : "新增";

      $("taskTitle").value = task?.title || "";
      $("taskDescription").value = task?.description || "";
      $("taskDueDate").value = task?.dueDate || "";
      $("taskPriority").value = task?.priority || "medium";
      $("taskProgress").value = progress;
      $("rangeValue").textContent = `${progress}%`;

      $("modalBackdrop").classList.add("show");
      setTimeout(() => $("taskTitle").focus(), 50);
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("show");
      editingId = null;
      $("taskForm").reset();
      $("taskPriority").value = "medium";
      $("taskProgress").value = 0;
      $("rangeValue").textContent = "0%";
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const title = $("taskTitle").value.trim();
      if (!title) {
        showNotice("請輸入事項名稱。", "error");
        $("taskTitle").focus();
        return;
      }

      const progress = snapProgress($("taskProgress").value);
      const data = {
        title,
        description: $("taskDescription").value.trim(),
        dueDate: $("taskDueDate").value,
        priority: $("taskPriority").value,
        progress,
        completed: progress === 100
      };

      if (editingId) {
        const index = tasks.findIndex(task => task.id === editingId);
        if (index !== -1) tasks[index] = { ...tasks[index], ...data };
        showNotice("待辦事項已更新。");
      } else {
        tasks.push({ id: generateId(), createdAt: new Date().toISOString(), ...data });
        showNotice("待辦事項已新增。");
      }

      saveTasks();
      renderAll();
      closeModal();
    }

    /* ---------- 完成 / 重開 / 刪除 ---------- */
    function completeTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      task.progress = 100;
      task.completed = true;
      saveTasks();
      renderAll();
      showNotice("已完成待辦事項。");
    }

    function reopenTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      task.completed = false;
      task.progress = Math.min(snapProgress(task.progress), 100 - PROGRESS_STEP); // 100 → 90
      saveTasks();
      renderAll();
      showNotice("已重新開啟待辦事項。");
    }

    function deleteTask(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      if (!window.confirm(`確定要刪除「${task.title}」嗎？`)) return;
      tasks = tasks.filter(item => item.id !== id);
      saveTasks();
      renderAll();
      showNotice("待辦事項已刪除。");
    }

    function handleTaskAction(button) {
      const id = button.dataset.id;
      const action = button.dataset.action;
      const task = tasks.find(item => item.id === id);

      if (action === "complete") completeTask(id);
      if (action === "reopen") reopenTask(id);
      if (action === "delete") deleteTask(id);
      if (action === "edit" && task) openModal(task);
    }

    /* ---------- 事件綁定 ---------- */
    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", () => switchPage(button.dataset.page));
    });

    $("sidebarToggle").addEventListener("click", () => {
      setSidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
    });

    $("quickAddBtn").addEventListener("click", () => {
      switchPage("tasks");
      openModal();
    });

    $("addTaskBtn").addEventListener("click", () => openModal());
    $("closeModalBtn").addEventListener("click", closeModal);
    $("cancelModalBtn").addEventListener("click", closeModal);
    $("taskForm").addEventListener("submit", handleFormSubmit);

    $("taskProgress").addEventListener("input", () => {
      $("rangeValue").textContent = `${$("taskProgress").value}%`;
    });

    $("modalBackdrop").addEventListener("click", (event) => {
      if (event.target === $("modalBackdrop")) closeModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && $("modalBackdrop").classList.contains("show")) closeModal();
    });

    // 卡片上的按鈕操作；點擊卡片其他區域則展開／收合說明
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (button) {
        handleTaskAction(button);
        return;
      }
      const card = event.target.closest(".task-card.has-desc");
      if (card) card.classList.toggle("expanded");
    });

    initSidebar();
    renderAll();
  </script>
</body>
</html>
